<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <title>Babylon.js sample code</title>
    <!-- Babylon.js -->
    <script src="https://code.jquery.com/pep/0.4.2/pep.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.6.2/dat.gui.min.js"></script>
    <script src="https://preview.babylonjs.com/ammo.js"></script>
    <script src="https://preview.babylonjs.com/cannon.js"></script>
    <script src="https://preview.babylonjs.com/Oimo.js"></script>
    <script src="https://preview.babylonjs.com/earcut.min.js"></script>
    <script src="https://preview.babylonjs.com/babylon.js"></script>
    <script src="https://preview.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <script src="https://preview.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTextures.min.js"></script>
    <script src="https://preview.babylonjs.com/postProcessesLibrary/babylonjs.postProcess.min.js"></script>
    <script src="https://preview.babylonjs.com/loaders/babylonjs.loaders.js"></script>
    <script src="https://preview.babylonjs.com/serializers/babylonjs.serializers.min.js"></script>
    <script src="https://preview.babylonjs.com/gui/babylon.gui.min.js"></script>
    <script src="https://preview.babylonjs.com/inspector/babylon.inspector.bundle.js"></script>
    <script src="audioClasses.js"></script>
    <script src="sounds.js"></script>

    <style>
        html,
        body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #editPanel {
            touch-action: none;
            position: absolute;
            top: 10px;
            right: 10px;
            width: 280px;
            max-height: calc(100vh - 20px);
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.9);
            color: #e0e0e0;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #444;
            display: none;
            flex-direction: column;
            z-index: 1000;
            box-sizing: border-box;
        }

        #editPanel .ep-header {
            padding: 8px 10px;
            background: #111;
            border-bottom: 1px solid #444;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #fff;
            display: flex;
            justify-content: space-between;
        }

        #editPanel .ep-hint {
            color: #555;
            font-size: 10px;
            font-weight: normal;
        }

        #editPanel .ep-section {
            padding: 8px 10px;
            border-bottom: 1px solid #1e1e1e;
        }

        #editPanel .ep-label {
            display: block;
            margin-bottom: 4px;
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #editPanel .ep-toggle label {
            margin-right: 12px;
            cursor: pointer;
            color: #ccc;
        }

        #editPanel .ep-file-row {
            display: flex;
            gap: 4px;
        }

        #editPanel .ep-file-row input[type="text"] {
            flex: 1;
            min-width: 0;
        }

        #editPanel #browseFileBtn {
            flex-shrink: 0;
            padding: 4px 7px;
            background: #111;
            border: 1px solid #444;
            color: #ccc;
            cursor: pointer;
            font-family: monospace;
            font-size: 11px;
            white-space: nowrap;
        }

        #editPanel #browseFileBtn:hover {
            background: #222;
            border-color: #888;
        }

        #editPanel input[type="text"] {
            width: 100%;
            background: #111;
            border: 1px solid #444;
            color: #e0e0e0;
            font-family: monospace;
            font-size: 11px;
            padding: 4px 6px;
            box-sizing: border-box;
        }

        #editPanel input[type="range"] {
            width: 100%;
            cursor: pointer;
            margin-top: 2px;
        }

        #editPanel .ep-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #editPanel #soundList {
            max-height: 130px;
            overflow-y: auto;
        }

        #editPanel .sound-item {
            display: flex;
            align-items: center;
            padding: 4px 2px;
            border-bottom: 1px solid #1a1a1a;
            cursor: pointer;
            font-size: 11px;
            gap: 4px;
        }

        #editPanel .sound-item:hover {
            background: #111;
        }

        #editPanel .sound-item.selected {
            color: #ff44ff;
            background: #1a0022;
            border-left: 2px solid #cc00cc;
        }

        #editPanel .ep-xyz {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }

        #editPanel .ep-xyz label {
            flex: 1;
            color: #888;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            cursor: ew-resize;
            user-select: none;
        }

        #editPanel .ep-xyz input[type="number"] {
            cursor: text;
        }

        #editPanel .ep-xyz input[type="number"] {
            width: 100%;
            background: #111;
            border: 1px solid #444;
            color: #e0e0e0;
            font-family: monospace;
            font-size: 11px;
            padding: 3px 4px;
            box-sizing: border-box;
        }

        #editPanel .si-badge {
            font-size: 9px;
            padding: 1px 3px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        #editPanel .si-badge.area {
            background: #003333;
            color: #00cccc;
        }

        #editPanel .si-badge.oneshot {
            background: #332200;
            color: #ffaa00;
        }

        #editPanel .si-info {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #editPanel .si-del {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 13px;
            padding: 0 2px;
            line-height: 1;
        }

        #editPanel .si-del:hover {
            color: #ff4444;
        }

        #editPanel .ep-actions {
            display: flex;
            gap: 6px;
            padding: 8px 10px;
            border-bottom: 1px solid #1e1e1e;
        }

        #editPanel .ep-actions button {
            flex: 1;
            padding: 5px;
            background: #111;
            border: 1px solid #444;
            color: #ccc;
            cursor: pointer;
            font-family: monospace;
            font-size: 11px;
        }

        #editPanel .ep-actions button:hover {
            background: #222;
            border-color: #888;
        }

        #editingBar {
            padding: 5px 10px;
            background: #002222;
            border-bottom: 1px solid #005555;
            color: #00cccc;
            font-size: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #editingBar button {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
        }

        #editingBar button:hover {
            color: #aaa;
        }

        #editPanel #codeOutput {
            width: 100%;
            height: 90px;
            background: #080808;
            border: none;
            border-top: 1px solid #1e1e1e;
            color: #66ff66;
            font-family: monospace;
            font-size: 10px;
            resize: vertical;
            box-sizing: border-box;
            padding: 6px 10px;
        }
    </style>
</head>

<body>
    <canvas id="renderCanvas"></canvas>
    <div id="editPanel">
        <div class="ep-header">SOUND EDITOR <span class="ep-hint">Ctrl+E to exit</span></div>
        <div id="autoSaveBar"
            style="padding:3px 10px;background:#001a00;border-bottom:1px solid #1e1e1e;color:#448844;font-size:9px;display:none;">
        </div>
        <div id="editingBar" style="display:none"></div>
        <div class="ep-section">
            <span class="ep-label">Type</span>
            <div class="ep-toggle">
                <label><input type="radio" name="soundType" value="AreaSound" checked> AreaSound</label>
                <label><input type="radio" name="soundType" value="OneShotCollisionSound"> OneShotCollision</label>
            </div>
        </div>
        <div class="ep-section">
            <span class="ep-label">File <span class="ep-hint">(comma-separate for multiple)</span></span>
            <div class="ep-file-row">
                <input type="text" id="soundFile" placeholder="./audio/ambient.wav">
                <button id="browseFileBtn">Browse…</button>
            </div>
            <input type="file" id="soundFilePicker" accept="audio/*" style="display:none">
        </div>
        <div class="ep-section">
            <div class="ep-row"><span class="ep-label">Volume</span><span id="volumeVal">0.5</span></div>
            <input type="range" id="soundVolume" min="0" max="1" step="0.05" value="0.5">
        </div>
        <div id="areaOptions" class="ep-section">
            <div class="ep-row"><span class="ep-label">Rolloff</span><span id="rolloffVal">1</span></div>
            <input type="range" id="soundRolloff" min="0.1" max="10" step="0.1" value="1">
            <div class="ep-row" style="margin-top:6px"><span class="ep-label">Min Distance</span><span
                    id="minDistVal">1</span></div>
            <input type="range" id="soundMinDist" min="0" max="20" step="0.5" value="1">
        </div>
        <div id="oneShotOptions" class="ep-section" style="display:none">
            <div class="ep-row"><span class="ep-label">Width</span><span id="widthVal">3</span></div>
            <input type="range" id="soundWidth" min="0.5" max="20" step="0.5" value="3">
            <div class="ep-row" style="margin-top:6px"><span class="ep-label">Cooldown (ms)</span><span
                    id="cooldownVal">2000</span></div>
            <input type="range" id="soundCooldown" min="500" max="10000" step="500" value="2000">
        </div>
        <div id="positionControls" class="ep-section" style="display:none">
            <span class="ep-label">Position</span>
            <div class="ep-xyz">
                <label>X<input type="number" id="posX" step="0.1"></label>
                <label>Y<input type="number" id="posY" step="0.1"></label>
                <label>Z<input type="number" id="posZ" step="0.1"></label>
            </div>
        </div>
        <div class="ep-section" style="text-align:center;padding:6px 10px">
            <button id="placeSoundBtn"
                style="width:100%;padding:6px;background:#111;border:1px solid #444;color:#ccc;cursor:pointer;font-family:monospace;font-size:11px;">Place
                Sound at Camera</button>
            <div class="ep-hint" style="margin-top:4px">or press SPACE</div>
        </div>
        <div class="ep-section">
            <div class="ep-row"><span class="ep-label">Placed Sounds</span><span id="soundCount"
                    class="ep-hint">0</span></div>
            <div id="soundList"></div>
        </div>
        <div class="ep-actions">
            <button id="copyCodeBtn">Copy sounds.js</button>
            <button id="clearAllBtn">Clear All</button>
        </div>
        <textarea id="codeOutput" readonly
            placeholder="// sounds.js content will appear here&#10;// Copy it and replace the contents of sounds.js"></textarea>
    </div>
    <!-- <script src="audio.js"></script> -->
    <script>
        var canvas = document.getElementById("renderCanvas");
        var editPanel = document.getElementById("editPanel");
        var isEditMode = false;
        var placedSounds = [];
        var selectedSoundIndex = -1;
        var universalCamera = null;
        var arcRotateCamera = null;
        var hemiLight = null;
        var torch = null;

        var engine = null;
        var scene = null;
        var sceneToRender = null;
        var createDefaultEngine = function () {
            return new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: true,
                stencil: true,
                disableWebGL2Support: false
            });
        };


        // You have to create a function called createScene. This function must return a BABYLON.Scene object
        // You can reference the following variables: engine, canvas
        // You must at least define a camera
        var createScene = function () {
            var scene = new BABYLON.Scene(engine);
            initAudio(scene);
            scene.useRightHandedSystem = true;
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);
            engine.displayLoadingUI();
            BABYLON.Mesh.checkCollisions = true;

            // Dim ambient light
            hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.02;

            // Torch spotlight
            torch = new BABYLON.SpotLight("torch", BABYLON.Vector3.Zero(), BABYLON.Vector3.Forward(), Math.PI / 3, 2, scene);
            torch.intensity = 1000;
            torch.range = 100;
            torch.diffuse = new BABYLON.Color3(1, 0.9, 0.7);
            torch.specular = new BABYLON.Color3(1, 0.9, 0.7);

            scene.gravity = new BABYLON.Vector3(0, -0.5, 0);

            universalCamera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(-73, -12, -46), scene);
            universalCamera.attachControl(canvas, true);

            universalCamera.keysUp.push(87); //W
            universalCamera.keysDown.push(83) //S
            universalCamera.keysLeft.push(65); //A
            universalCamera.keysRight.push(68); //D
            universalCamera.setTarget(new BABYLON.Vector3(-73, -12, -100));
            universalCamera.speed = 0.1;
            universalCamera.angularSensibilityX = 20;
            universalCamera.angularSensibilityZ = 2000;
            universalCamera.checkCollisions = true;
            universalCamera.ellipsoid = new BABYLON.Vector3(0.5, 0.3, 0.5);
            universalCamera.ellipsoidOffset = new BABYLON.Vector3(0, -0.6, 0);

            // Create ArcRotateCamera for edit mode
            arcRotateCamera = new BABYLON.ArcRotateCamera("arcCamera", -Math.PI / 2, Math.PI / 2.5, 5, new BABYLON.Vector3(-73, -12, -73), scene);
            arcRotateCamera.inputs.clear(); // handle all input manually

            // Set initial camera to universal
            scene.activeCamera = universalCamera;
            startSoundCollisions(universalCamera);

            BABYLON.SceneLoader.ImportMesh("", "./", "krimson_city_sewers.glb", scene, function (newMeshes) {
                console.log("loaded textures/models");

                // Force materials to respond to spotlight
                var sewersToMerge = [];
                newMeshes.forEach(function (mesh) {
                    if (mesh.material) {
                        // For PBR materials, ensure they respond to lights
                        if (mesh.material.getClassName() === "PBRMaterial") {
                            mesh.material.directIntensity = 1.0;
                            mesh.material.environmentIntensity = 0.0;
                        }
                        mesh.material.maxSimultaneousLights = 4;
                    }
                    if (mesh.name.indexOf("Sewers_") === 0) {
                        sewersToMerge.push(mesh);
                    }
                });

                // Build invisible collision meshes for raycasting — originals stay visible with textures intact
                // Group by vertex attribute signature so only compatible meshes are merged together
                if (sewersToMerge.length > 0) {
                    var groups = {};
                    sewersToMerge.forEach(function (mesh) {
                        mesh.isPickable = false;
                        var key = mesh.getVerticesDataKinds().slice().sort().join("|");
                        if (!groups[key]) groups[key] = [];
                        groups[key].push(mesh);
                    });
                    Object.keys(groups).forEach(function (key, i) {
                        var merged = BABYLON.Mesh.MergeMeshes(groups[key], false, true);
                        if (merged) {
                            merged.name = "sewers_collision_" + i;
                            merged.isVisible = false;
                            merged.isPickable = true;
                            merged.checkCollisions = true;
                        }
                    });
                }

                setTimeout(function () {
                    engine.hideLoadingUI();
                }, 2000);
            });

            var playerHeight = 1.8;
            var rayLength = 1000;

            scene.registerBeforeRender(function () {
                // Update torch position and direction to follow camera
                torch.position = scene.activeCamera.position.clone();
                torch.direction = scene.activeCamera.getForwardRay().direction;

                if (!isEditMode) {
                    // Single downward raycast for floor height — handles steps up and down
                    var pickPredicate = function (mesh) { return mesh.isPickable; };
                    var downRay = new BABYLON.Ray(universalCamera.position, new BABYLON.Vector3(0, -1, 0), rayLength);
                    var downHit = scene.pickWithRay(downRay, pickPredicate);
                    if (downHit.pickedMesh) {
                        var targetY = downHit.pickedPoint.y + playerHeight;
                        universalCamera.position.y += (targetY - universalCamera.position.y) * 0.15;
                    }
                }

                textInfo.text = "Player's position X:" + (scene.activeCamera.position.x).toFixed(2) + " Z:" + (scene.activeCamera.position.z).toFixed(2) + " Y:" + (scene.activeCamera.position.y).toFixed(2) + (isEditMode ? " [EDIT MODE]" : "");
            });



            // GUI
            let GUIInfo = "Player's position";
            var advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");
            var stackPanel = new BABYLON.GUI.StackPanel();
            stackPanel.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM;
            stackPanel.isVertical = true;
            advancedTexture.addControl(stackPanel);

            var textInfo = new BABYLON.GUI.TextBlock();
            textInfo.color = "white";
            textInfo.fontSize = 16;
            textInfo.height = "30px";
            stackPanel.addControl(textInfo);

            initSounds();

            return scene;
        };



        var engine;
        var scene;
        initFunction = async function () {
            var asyncEngineCreation = async function () {
                try {
                    return createDefaultEngine();
                } catch (e) {
                    console.log("the available createEngine function failed. Creating the default engine instead");
                    return createDefaultEngine();
                }
            }

            engine = await asyncEngineCreation();
            if (!engine) throw 'engine should not be null.';
            if (BABYLON.AbstractEngine && BABYLON.AbstractEngine.AudioEngineFactory && !BABYLON.AbstractEngine.audioEngine) {
                BABYLON.AbstractEngine.audioEngine = BABYLON.AbstractEngine.AudioEngineFactory(canvas);
            }
            scene = createScene();
        };
        initFunction().then(() => {
            sceneToRender = scene
            engine.runRenderLoop(function () {
                if (sceneToRender && sceneToRender.activeCamera) {
                    sceneToRender.render();
                }
            });

            // Add key event listeners for edit mode
            var moveEditCameraForward = function (amount) {
                var forward = arcRotateCamera.target.subtract(arcRotateCamera.position).normalize();
                arcRotateCamera.target.addInPlace(forward.scale(amount));
            };
            var moveEditCameraRight = function (amount) {
                var forward = arcRotateCamera.target.subtract(arcRotateCamera.position).normalize();
                var right = BABYLON.Vector3.Cross(forward, BABYLON.Vector3.Up()).normalize();
                arcRotateCamera.target.addInPlace(right.scale(amount));
            };
            var wheelListener = function (e) {
                e.preventDefault();
                moveEditCameraForward(-e.deltaY * 0.05);
            };
            // Manual mouse orbit/pan for edit mode
            var editMouseButton = -1;
            var editLastX = 0;
            var editLastY = 0;
            var editDownX = 0;
            var editDownY = 0;
            var editPointerOnCanvas = false;
            canvas.addEventListener('contextmenu', function (e) { if (isEditMode) e.preventDefault(); });
            canvas.addEventListener('pointerdown', function (e) {
                if (!isEditMode) return;
                editPointerOnCanvas = true;
                editMouseButton = e.button;
                editLastX = e.clientX;
                editLastY = e.clientY;
                editDownX = e.clientX;
                editDownY = e.clientY;
            });
            window.addEventListener('pointermove', function (e) {
                if (!isEditMode || editMouseButton === -1) return;
                var dx = e.clientX - editLastX;
                var dy = e.clientY - editLastY;
                editLastX = e.clientX;
                editLastY = e.clientY;
                if (editMouseButton === 0) {
                    // Left-drag: orbit around current camera position
                    var camPos = arcRotateCamera.position.clone();
                    arcRotateCamera.alpha += dx * 0.005;
                    arcRotateCamera.beta = Math.max(0.01, Math.min(Math.PI - 0.01, arcRotateCamera.beta - dy * 0.005));
                    // Recompute target so camera stays pinned at camPos
                    var sB = Math.sin(arcRotateCamera.beta), cB = Math.cos(arcRotateCamera.beta);
                    var cA = Math.cos(arcRotateCamera.alpha), sA = Math.sin(arcRotateCamera.alpha);
                    arcRotateCamera.target.set(
                        camPos.x - arcRotateCamera.radius * sB * cA,
                        camPos.y - arcRotateCamera.radius * cB,
                        camPos.z - arcRotateCamera.radius * sB * sA
                    );
                } else if (editMouseButton === 2) {
                    // Right-drag: pan
                    var forward = arcRotateCamera.target.subtract(arcRotateCamera.position).normalize();
                    var right = BABYLON.Vector3.Cross(forward, BABYLON.Vector3.Up()).normalize();
                    var up = BABYLON.Vector3.Cross(right, forward).normalize();
                    arcRotateCamera.target.addInPlace(right.scale(-dx * 0.05));
                    arcRotateCamera.target.addInPlace(up.scale(dy * 0.05));
                }
            });
            window.addEventListener('pointerup', function (e) {
                if (isEditMode && e.button === 0 && editPointerOnCanvas) {
                    var dx = e.clientX - editDownX;
                    var dy = e.clientY - editDownY;
                    if (Math.sqrt(dx * dx + dy * dy) < 5) {
                        var pickResult = scene.pick(e.clientX, e.clientY);
                        if (pickResult.hit && pickResult.pickedMesh) {
                            var idx = placedSounds.findIndex(function (s) { return s.ghostMesh === pickResult.pickedMesh; });
                            selectSound(idx !== -1 ? idx : -1);
                        } else {
                            selectSound(-1);
                        }
                    }
                }
                if (e.button === editMouseButton) editMouseButton = -1;
                editPointerOnCanvas = false;
            });

            var lastPinchDistance = null;
            var touchStartListener = function (e) {
                if (e.touches.length === 2) {
                    var dx = e.touches[0].clientX - e.touches[1].clientX;
                    var dy = e.touches[0].clientY - e.touches[1].clientY;
                    lastPinchDistance = Math.sqrt(dx * dx + dy * dy);
                } else {
                    lastPinchDistance = null;
                }
            };
            var touchMoveListener = function (e) {
                if (e.touches.length === 2 && lastPinchDistance !== null) {
                    e.preventDefault();
                    var dx = e.touches[0].clientX - e.touches[1].clientX;
                    var dy = e.touches[0].clientY - e.touches[1].clientY;
                    var distance = Math.sqrt(dx * dx + dy * dy);
                    var delta = lastPinchDistance - distance;
                    moveEditCameraForward(-delta * 0.5);
                    lastPinchDistance = distance;
                }
            };
            var touchEndListener = function (e) {
                if (e.touches.length < 2) {
                    lastPinchDistance = null;
                }
            };
            window.addEventListener('keydown', function (event) {
                // Ctrl+E to toggle edit mode
                if (event.ctrlKey && event.key === 'e') {
                    event.preventDefault();
                    isEditMode = !isEditMode;
                    if (isEditMode) {
                        // Switch to ArcRotateCamera — place it exactly at the play camera's position
                        var currentPos = universalCamera.position.clone();
                        var lookDir = universalCamera.getTarget().subtract(currentPos).normalize();
                        // Orbit pivot 5 units ahead; setPosition() derives alpha/beta/radius automatically
                        arcRotateCamera.target = currentPos.add(lookDir.scale(5));
                        arcRotateCamera.setPosition(currentPos);
                        scene.activeCamera = arcRotateCamera;
                        // Change to world light
                        torch.intensity = 0;
                        hemiLight.intensity = 2.0;
                        editPanel.style.display = 'flex';
                        // Import any externally registered sounds not yet tracked
                        (window._registeredSounds || []).forEach(function (rs) {
                            if (placedSounds.some(function (ps) { return ps._source === rs; })) return;
                            var isArea = rs instanceof AreaSound;
                            var mesh = isArea ? rs.sphere : rs.box;
                            var pos = mesh ? mesh.position : rs.position;
                            var index = placedSounds.length;
                            var config = {
                                _source: rs,
                                type: isArea ? 'AreaSound' : 'OneShotCollisionSound',
                                file: isArea
                                    ? rs.sound.name
                                    : (rs.sounds.length ? rs.sounds.map(function (s) { return s.name; }).join(', ') : rs.sound.name),
                                x: parseFloat(pos.x.toFixed(2)),
                                y: parseFloat(pos.y.toFixed(2)),
                                z: parseFloat(pos.z.toFixed(2)),
                                volume: rs.volume,
                                rolloff: isArea ? rs.rolloff : undefined,
                                minDistance: isArea ? rs.minDistance : undefined,
                                w: !isArea ? rs.w : undefined,
                                timeBetweenPlays: !isArea ? rs.timeBetweenPlays : undefined
                            };
                            var ghostMat = new BABYLON.StandardMaterial('ghostMat_' + index, scene);
                            ghostMat.wireframe = true;
                            ghostMat.emissiveColor = isArea ? new BABYLON.Color3(0, 0.8, 0.8) : new BABYLON.Color3(1, 0.8, 0);
                            config.ghostMesh = isArea
                                ? BABYLON.MeshBuilder.CreateSphere('ghost_' + index, { diameter: 1 }, scene)
                                : BABYLON.MeshBuilder.CreateBox('ghost_' + index, { size: 1 }, scene);
                            config.ghostMesh.material = ghostMat;
                            config.ghostMesh.position = new BABYLON.Vector3(config.x, config.y, config.z);
                            updateGhostMesh(config);
                            placedSounds.push(config);
                        });
                        // Restore from localStorage if nothing is placed yet
                        if (placedSounds.length === 0) {
                            try {
                                var saved = localStorage.getItem('ks_sounds');
                                if (saved) {
                                    var restored = JSON.parse(saved);
                                    restored.forEach(function (data) {
                                        var idx = placedSounds.length;
                                        var isArea = data.type === 'AreaSound';
                                        var ghostMat = new BABYLON.StandardMaterial('ghostMat_r' + idx, scene);
                                        ghostMat.wireframe = true;
                                        ghostMat.emissiveColor = isArea ? new BABYLON.Color3(0, 0.8, 0.8) : new BABYLON.Color3(1, 0.8, 0);
                                        var mesh = isArea
                                            ? BABYLON.MeshBuilder.CreateSphere('ghost_r' + idx, { diameter: 1 }, scene)
                                            : BABYLON.MeshBuilder.CreateBox('ghost_r' + idx, { size: 1 }, scene);
                                        mesh.material = ghostMat;
                                        mesh.position = new BABYLON.Vector3(data.x, data.y, data.z);
                                        data.ghostMesh = mesh;
                                        updateGhostMesh(data);
                                        placedSounds.push(data);
                                    });
                                    if (restored.length > 0) {
                                        var bar = document.getElementById('autoSaveBar');
                                        if (bar) { bar.style.display = 'block'; bar.textContent = 'Restored ' + restored.length + ' sound' + (restored.length !== 1 ? 's' : '') + ' from auto-save'; }
                                    }
                                }
                            } catch (e) { }
                        }

                        updateSoundList();
                        generateCode();
                        placedSounds.forEach(function (s) { if (s.ghostMesh) s.ghostMesh.isVisible = true; });
                        // Add wheel and pinch listeners
                        canvas.addEventListener('wheel', wheelListener, { passive: false });
                        window.addEventListener('touchstart', touchStartListener, { passive: true });
                        window.addEventListener('touchmove', touchMoveListener, { passive: false });
                        window.addEventListener('touchend', touchEndListener, { passive: true });
                    } else {
                        // Switch back to UniversalCamera — sync position/look from arc camera
                        universalCamera.position.copyFrom(arcRotateCamera.position);
                        universalCamera.setTarget(arcRotateCamera.target.clone());
                        scene.activeCamera = universalCamera;
                        // Change back to torch light
                        torch.intensity = 1000;
                        hemiLight.intensity = 0.02;
                        editPanel.style.display = 'none';
                        placedSounds.forEach(function (s) { if (s.ghostMesh) s.ghostMesh.isVisible = false; });
                        // Remove wheel and pinch listeners
                        canvas.removeEventListener('wheel', wheelListener);
                        window.removeEventListener('touchstart', touchStartListener);
                        window.removeEventListener('touchmove', touchMoveListener);
                        window.removeEventListener('touchend', touchEndListener);
                        lastPinchDistance = null;
                    }
                }

                // Arrow keys and WASD to move in edit mode
                if (isEditMode && ['ArrowUp', 'ArrowDown', 'w', 'W', 's', 'S', 'a', 'A', 'd', 'D'].includes(event.key)) {
                    event.preventDefault();
                    if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W') moveEditCameraForward(1);
                    if (event.key === 'ArrowDown' || event.key === 's' || event.key === 'S') moveEditCameraForward(-1);
                    if (event.key === 'a' || event.key === 'A') moveEditCameraRight(-1);
                    if (event.key === 'd' || event.key === 'D') moveEditCameraRight(1);
                }

                // Spacebar to place a sound in edit mode
                if (isEditMode && event.key === ' ') {
                    event.preventDefault();
                    placeSoundAtCamera();
                }
            });
        });

        // Resize
        window.addEventListener("resize", function () {
            engine.resize();
        });

        // --- Sound Editor Panel ---

        // Slider value displays — also live-update selected sound
        document.getElementById('soundVolume').addEventListener('input', function () {
            document.getElementById('volumeVal').textContent = this.value;
            if (selectedSoundIndex !== -1) { placedSounds[selectedSoundIndex].volume = parseFloat(this.value); generateCode(); }
        });
        document.getElementById('soundRolloff').addEventListener('input', function () {
            document.getElementById('rolloffVal').textContent = this.value;
            if (selectedSoundIndex !== -1) {
                var s = placedSounds[selectedSoundIndex];
                s.rolloff = parseFloat(this.value);
                updateGhostMesh(s);
                generateCode();
            }
        });
        document.getElementById('soundMinDist').addEventListener('input', function () {
            document.getElementById('minDistVal').textContent = this.value;
            if (selectedSoundIndex !== -1) { placedSounds[selectedSoundIndex].minDistance = parseFloat(this.value); generateCode(); }
        });
        document.getElementById('soundWidth').addEventListener('input', function () {
            document.getElementById('widthVal').textContent = this.value;
            if (selectedSoundIndex !== -1) {
                var s = placedSounds[selectedSoundIndex];
                s.w = parseFloat(this.value);
                updateGhostMesh(s);
                generateCode();
            }
        });
        document.getElementById('soundCooldown').addEventListener('input', function () {
            document.getElementById('cooldownVal').textContent = this.value;
            if (selectedSoundIndex !== -1) { placedSounds[selectedSoundIndex].timeBetweenPlays = parseInt(this.value); generateCode(); }
        });
        document.getElementById('browseFileBtn').addEventListener('click', function () {
            document.getElementById('soundFilePicker').click();
        });

        document.getElementById('soundFilePicker').addEventListener('change', function () {
            if (!this.files || !this.files.length) return;
            var name = this.files[0].name;
            var path = './audio/' + name;
            var fileInput = document.getElementById('soundFile');
            // If multiple files already entered, append; otherwise replace
            var existing = fileInput.value.trim();
            if (existing && existing !== './assets/ambient.wav' && existing !== './audio/ambient.wav') {
                fileInput.value = existing + ', ' + path;
            } else {
                fileInput.value = path;
            }
            fileInput.dispatchEvent(new Event('input'));
            // Reset picker so the same file can be re-selected if needed
            this.value = '';
        });

        document.getElementById('soundFile').addEventListener('input', function () {
            if (selectedSoundIndex !== -1) { placedSounds[selectedSoundIndex].file = this.value.trim(); updateSoundList(); generateCode(); }
        });

        function makeScrubLabel(labelEl, inputEl) {
            var scrubbing = false;
            var startX = 0;
            var startVal = 0;
            labelEl.addEventListener('pointerdown', function (e) {
                if (e.target === inputEl) return;
                scrubbing = true;
                startX = e.clientX;
                startVal = parseFloat(inputEl.value) || 0;
                labelEl.setPointerCapture(e.pointerId);
                e.preventDefault();
            });
            labelEl.addEventListener('pointermove', function (e) {
                if (!scrubbing) return;
                inputEl.value = parseFloat((startVal + (e.clientX - startX) * 0.1).toFixed(2));
                inputEl.dispatchEvent(new Event('input'));
            });
            labelEl.addEventListener('pointerup', function () { scrubbing = false; });
            labelEl.addEventListener('pointercancel', function () { scrubbing = false; });
        }

        ['posX', 'posY', 'posZ'].forEach(function (id) {
            makeScrubLabel(document.getElementById(id).parentElement, document.getElementById(id));
        });

        ['posX', 'posY', 'posZ'].forEach(function (id) {
            document.getElementById(id).addEventListener('input', function () {
                if (selectedSoundIndex === -1) return;
                var s = placedSounds[selectedSoundIndex];
                var axis = id.slice(-1).toLowerCase(); // 'x', 'y', or 'z'
                s[axis] = parseFloat(this.value) || 0;
                if (s.ghostMesh) s.ghostMesh.position[axis] = s[axis];
                updateSoundList();
                generateCode();
            });
        });

        // Toggle area/oneshot options
        document.querySelectorAll('input[name="soundType"]').forEach(function (radio) {
            radio.addEventListener('change', function () {
                var isArea = this.value === 'AreaSound';
                document.getElementById('areaOptions').style.display = isArea ? 'block' : 'none';
                document.getElementById('oneShotOptions').style.display = isArea ? 'none' : 'block';
            });
        });

        function placeSoundAtCamera() {
            var pos = scene.activeCamera.position;
            var type = document.querySelector('input[name="soundType"]:checked').value;
            var file = document.getElementById('soundFile').value.trim() || './assets/sound.wav';
            var volume = parseFloat(document.getElementById('soundVolume').value);
            var index = placedSounds.length;

            var config = {
                type: type,
                file: file,
                x: parseFloat(pos.x.toFixed(2)),
                y: parseFloat(pos.y.toFixed(2)),
                z: parseFloat(pos.z.toFixed(2)),
                volume: volume
            };

            var ghostMat = new BABYLON.StandardMaterial('ghostMat_' + index, scene);
            ghostMat.wireframe = true;

            if (type === 'AreaSound') {
                config.rolloff = parseFloat(document.getElementById('soundRolloff').value);
                config.minDistance = parseFloat(document.getElementById('soundMinDist').value);
                // Unit sphere — scaled via updateGhostMesh
                config.ghostMesh = BABYLON.MeshBuilder.CreateSphere('ghost_' + index, { diameter: 1 }, scene);
                ghostMat.emissiveColor = new BABYLON.Color3(0, 0.8, 0.8);
            } else {
                config.w = parseFloat(document.getElementById('soundWidth').value);
                config.timeBetweenPlays = parseInt(document.getElementById('soundCooldown').value);
                // Unit box — scaled via updateGhostMesh
                config.ghostMesh = BABYLON.MeshBuilder.CreateBox('ghost_' + index, { size: 1 }, scene);
                ghostMat.emissiveColor = new BABYLON.Color3(1, 0.8, 0);
            }

            config.ghostMesh.material = ghostMat;
            config.ghostMesh.position = new BABYLON.Vector3(config.x, config.y, config.z);
            updateGhostMesh(config);

            placedSounds.push(config);
            updateSoundList();
            generateCode();
            selectSound(placedSounds.length - 1);
        }

        function updateGhostMesh(s) {
            if (!s.ghostMesh) return;
            if (s.type === 'AreaSound') {
                var d = (8 / s.rolloff) * 3;
                s.ghostMesh.scaling.setAll(d);
            } else {
                s.ghostMesh.scaling.setAll(s.w);
            }
        }


        function selectSound(i) {
            // Restore previous selection mesh appearance
            if (selectedSoundIndex !== -1 && placedSounds[selectedSoundIndex]) {
                var prev = placedSounds[selectedSoundIndex];
                if (prev.ghostMesh) {
                    prev.ghostMesh.material.wireframe = true;
                    prev.ghostMesh.material.alpha = 1;
                    prev.ghostMesh.material.emissiveColor = prev.type === 'AreaSound'
                        ? new BABYLON.Color3(0, 0.8, 0.8)
                        : new BABYLON.Color3(1, 0.8, 0);
                }
            }

            selectedSoundIndex = i;
            var bar = document.getElementById('editingBar');
            var posControls = document.getElementById('positionControls');

            if (i === -1) {
                bar.style.display = 'none';
                posControls.style.display = 'none';
                return;
            }

            var s = placedSounds[i];

            // Highlight: wireframe yellow
            if (s.ghostMesh) {
                s.ghostMesh.material.wireframe = true;
                s.ghostMesh.material.alpha = 1;
                s.ghostMesh.material.emissiveColor = new BABYLON.Color3(1, 1, 0);
            }

            // Teleport camera to look at the sound
            arcRotateCamera.target = new BABYLON.Vector3(s.x, s.y, s.z);

            // Populate controls
            document.querySelector('input[name="soundType"][value="' + s.type + '"]').checked = true;
            document.getElementById('soundFile').value = s.file;
            document.getElementById('soundVolume').value = s.volume;
            document.getElementById('volumeVal').textContent = s.volume;

            var isArea = s.type === 'AreaSound';
            document.getElementById('areaOptions').style.display = isArea ? 'block' : 'none';
            document.getElementById('oneShotOptions').style.display = isArea ? 'none' : 'block';

            if (isArea) {
                document.getElementById('soundRolloff').value = s.rolloff;
                document.getElementById('rolloffVal').textContent = s.rolloff;
                document.getElementById('soundMinDist').value = s.minDistance !== undefined ? s.minDistance : 1;
                document.getElementById('minDistVal').textContent = s.minDistance !== undefined ? s.minDistance : 1;
            } else {
                document.getElementById('soundWidth').value = s.w;
                document.getElementById('widthVal').textContent = s.w;
                document.getElementById('soundCooldown').value = s.timeBetweenPlays;
                document.getElementById('cooldownVal').textContent = s.timeBetweenPlays;
            }

            // Position controls
            posControls.style.display = 'block';
            document.getElementById('posX').value = s.x;
            document.getElementById('posY').value = s.y;
            document.getElementById('posZ').value = s.z;

            bar.style.display = 'flex';
            bar.innerHTML = '<span>Editing: ' + (isArea ? 'AreaSound' : 'OneShotCollision') + ' #' + (i + 1) + '</span>' +
                '<button id="deselectBtn">✕ deselect</button>';
            document.getElementById('deselectBtn').addEventListener('click', function () { selectSound(-1); });

            updateSoundList();
        }

        function updateSoundList() {
            var list = document.getElementById('soundList');
            document.getElementById('soundCount').textContent = placedSounds.length;
            list.innerHTML = '';
            placedSounds.forEach(function (s, i) {
                var item = document.createElement('div');
                item.className = 'sound-item' + (i === selectedSoundIndex ? ' selected' : '');
                var isArea = s.type === 'AreaSound';
                var fileName = s.file.split('/').pop().split(',')[0];
                item.innerHTML =
                    '<span class="si-badge ' + (isArea ? 'area' : 'oneshot') + '">' +
                    (isArea ? 'AREA' : 'SHOT') +
                    '</span>' +
                    '<span class="si-info" title="' + s.file + '">' +
                    fileName + ' (' + s.x + ', ' + s.y + ', ' + s.z + ')' +
                    '</span>' +
                    '<button class="si-del" data-index="' + i + '">×</button>';
                item.addEventListener('click', function (e) {
                    if (e.target.classList.contains('si-del')) return;
                    selectSound(i === selectedSoundIndex ? -1 : i);
                });
                list.appendChild(item);
            });
            list.querySelectorAll('.si-del').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var i = parseInt(this.getAttribute('data-index'));
                    if (i === selectedSoundIndex) selectSound(-1);
                    if (placedSounds[i].ghostMesh) placedSounds[i].ghostMesh.dispose();
                    placedSounds.splice(i, 1);
                    updateSoundList();
                    generateCode();
                });
            });
        }

        function generateCode() {
            var areaSounds = placedSounds.filter(function (s) { return s.type === 'AreaSound'; });
            var oneShotSounds = placedSounds.filter(function (s) { return s.type === 'OneShotCollisionSound'; });
            var inner = [];

            if (areaSounds.length > 0) {
                inner.push('    let areaSounds = [];');
                areaSounds.forEach(function (s) {
                    var files = s.file.split(',').map(function (f) { return '"' + f.trim() + '"'; });
                    var fileStr = files.length > 1 ? '[' + files.join(', ') + ']' : files[0];
                    inner.push('    areaSounds.push(new AreaSound({ file: ' + fileStr +
                        ', x: ' + s.x + ', y: ' + s.y + ', z: ' + s.z +
                        ', volume: ' + s.volume + ', rolloff: ' + s.rolloff +
                        ', minDistance: ' + (s.minDistance !== undefined ? s.minDistance : 1) +
                        ', visible: false }));');
                });
            }

            if (oneShotSounds.length > 0) {
                inner.push('    let triggerSounds = [];');
                oneShotSounds.forEach(function (s) {
                    var files = s.file.split(',').map(function (f) { return '"' + f.trim() + '"'; });
                    var fileStr = files.length > 1 ? '[' + files.join(', ') + ']' : files[0];
                    inner.push('    triggerSounds.push(new OneShotCollisionSound({ file: ' + fileStr +
                        ', x: ' + s.x + ', y: ' + s.y + ', z: ' + s.z +
                        ', volume: ' + s.volume + ', w: ' + s.w +
                        ', timeBetweenPlays: ' + s.timeBetweenPlays +
                        ', visible: false }));');
                });
            }

            var lines = [
                '// ============================================================',
                '// SOUNDS — this is the only file you need to edit',
                '// ============================================================',
                'function initSounds() {'
            ].concat(inner.length ? inner : ['    // No sounds placed yet.']).concat(['}']);

            var code = lines.join('\n');
            document.getElementById('codeOutput').value = code;

            // Auto-save to localStorage
            try {
                var snapshot = placedSounds.map(function (s) {
                    return {
                        type: s.type, file: s.file, x: s.x, y: s.y, z: s.z,
                        volume: s.volume, rolloff: s.rolloff, minDistance: s.minDistance, w: s.w, timeBetweenPlays: s.timeBetweenPlays
                    };
                });
                localStorage.setItem('ks_sounds', JSON.stringify(snapshot));
                var now = new Date();
                var t = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
                var bar = document.getElementById('autoSaveBar');
                if (bar) { bar.style.display = 'block'; bar.textContent = 'Auto-saved at ' + t + ' (' + snapshot.length + ' sound' + (snapshot.length !== 1 ? 's' : '') + ')'; }
            } catch (e) { }
        }

        document.getElementById('codeOutput').addEventListener('click', function () {
            if (!this.value) return;
            this.focus();
            this.select();
        });

        document.getElementById('copyCodeBtn').addEventListener('click', function () {
            var btn = this;
            var ta = document.getElementById('codeOutput');
            if (!ta.value) return;
            function onSuccess() {
                btn.textContent = 'Copied!';
                setTimeout(function () { btn.textContent = 'Copy Code'; }, 1500);
            }
            function execFallback() {
                ta.focus();
                ta.select();
                document.execCommand('copy');
                onSuccess();
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(ta.value).then(onSuccess, execFallback);
            } else {
                execFallback();
            }
        });

        document.getElementById('clearAllBtn').addEventListener('click', function () {
            placedSounds.forEach(function (s) { if (s.ghostMesh) s.ghostMesh.dispose(); });
            placedSounds = [];
            updateSoundList();
            generateCode();
        });

        document.getElementById('placeSoundBtn').addEventListener('click', function () {
            if (isEditMode) placeSoundAtCamera();
        });
    </script>
</body>

</html>
